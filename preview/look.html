<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FEIJOA — how the website looks</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; background: #f7f4ee; color: #1a2e24; }
    header { padding: 32px 20px 8px; text-align: center; }
    h1 { font-weight: 500; letter-spacing: 0.18em; font-size: 22px; }
    p { font-family: system-ui, sans-serif; color: #5c6b62; max-width: 640px; margin: 8px auto 24px; }
    figure { margin: 0 auto 40px; max-width: 1100px; padding: 0 16px; }
    img { width: 100%; border-radius: 12px; border: 1px solid #d8e0d8; background: #fff; }
    figcaption { font-family: system-ui, sans-serif; font-size: 13px; margin-top: 10px; color: #5c6b62; }
    .phone { max-width: 390px; }
  </style>
</head>
<body>
  <header>
    <h1>FEIJOA</h1>
    <p>Pictures of the website. Scroll to see home, treatments, and phone view.</p>
  </header>
  <figure>
    <img src="home-desktop.png" alt="FEIJOA homepage" />
    <figcaption>Home — Banjara Hills clinic</figcaption>
  </figure>
  <figure>
    <img src="expertise-desktop.png" alt="Treatments page" />
    <figcaption>Expertise — full treatment list</figcaption>
  </figure>
  <figure class="phone">
    <img src="home-mobile.png" alt="Phone homepage" />
    <figcaption>Phone view</figcaption>
  </figure>
</body>
</html>
