<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FEIJOA · 강남 글래스스킨</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --sage:#7d9a78; --ink:#222; --bg:#f7f4ee; --muted:#6a6a64; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Noto Sans KR",sans-serif; background:var(--bg); color:var(--ink); }
    a { color: inherit; text-decoration: none; }
    header { display:flex; justify-content:space-between; align-items:center; padding:22px 7vw; background:#fff; }
    .logo { letter-spacing:.22em; font-size:13px; }
    nav { display:flex; gap:28px; font-size:14px; color:var(--muted); }
    .actions { display:flex; gap:12px; align-items:center; font-size:12px; }
    .pill { background:#3d4f3a; color:#fff; padding:9px 16px; border-radius:999px; }
    .hero { display:grid; grid-template-columns:1fr 1fr; min-height:78vh; }
    .hero-copy { padding:10vh 7vw; }
    .hero-copy p.small { letter-spacing:.14em; font-size:12px; color:var(--sage); }
    h1 { font-family:"Cormorant Garamond",serif; font-size:clamp(42px,6vw,72px); font-weight:500; line-height:1.15; margin:8px 0 16px; }
    .hero-copy .sub { color:var(--muted); max-width:36ch; }
    .hero-visual { background:linear-gradient(160deg,#e8efe4,#d7c4b4 60%,#c9b7a6); display:flex; align-items:flex-end; justify-content:center; padding:40px; color:#fff; }
    .hero-visual span { background:rgba(0,0,0,.25); padding:8px 12px; border-radius:8px; font-size:12px; }
    .row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding:48px 7vw; }
    .item { background:#fff; padding:28px 22px; border-radius:16px; }
    .item b { display:block; margin-bottom:8px; }
    .item span { color:var(--muted); font-size:13px; }
    .cta { margin:0 7vw 80px; background:#fff; padding:36px; border-radius:20px; display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .back { position:fixed; left:16px; bottom:16px; background:#fff; border:1px solid #ddd; padding:8px 12px; border-radius:999px; font-size:12px; }
    @media (max-width:800px) {
      nav { display:none; }
      .hero, .row, .cta { grid-template-columns:1fr; display:grid; }
    }
  </style>
</head>
<body>
  <a class="back" href="../index.html">← 모델 목록</a>
  <header>
    <div class="logo">FEIJOA</div>
    <nav>
      <a href="#about">클리닉</a>
      <a href="#tx">시술</a>
      <a href="#doc">의료진</a>
      <a href="#visit">오시는 길</a>
    </nav>
    <div class="actions">
      <span>KO · EN</span>
      <a class="pill" href="#book">예약하기</a>
    </div>
  </header>
  <section class="hero">
    <div class="hero-copy">
      <p class="small">HYDERABAD · KOREAN DERMATOLOGY</p>
      <h1>맑고 투명한 피부,</h1>
      <p class="sub">강남에서 익숙한 피부과 경험을 하이데라바드에서. 상담부터 시술까지 한국어로 안내합니다. (샘플 문구)</p>
    </div>
    <div class="hero-visual"><span>클리닉 사진 자리</span></div>
  </section>
  <section class="row" id="tx">
    <div class="item"><b>피부과</b><span>여드름 · 기미 · 장벽 케어</span></div>
    <div class="item"><b>모발</b><span>탈모 상담 · 두피 케어</span></div>
    <div class="item"><b>안티에이징</b><span>리프팅 · 탄력</span></div>
    <div class="item"><b>레이저</b><span>색소 · 모공 · 흉터</span></div>
  </section>
  <section class="cta" id="book">
    <div>
      <b>오늘 상담 예약</b>
      <p style="margin:6px 0 0;color:var(--muted);font-size:14px;">전화 · WhatsApp · 웹 예약 중 편한 방법</p>
    </div>
    <a class="pill" href="#">WhatsApp 상담</a>
  </section>
</body>
</html>
